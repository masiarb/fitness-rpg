services:

  mongo:
    image: mongo:8
    container_name: fitnessrpg-mongo

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  web:
    build: .

    container_name: fitnessrpg-web

    depends_on:
      - mongo

    ports:
      - "3000:3000"

    environment:
      MONGODB_URI: mongodb://root:password@mongo:27017/fitness-rpg?authSource=admin

    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongo-data: